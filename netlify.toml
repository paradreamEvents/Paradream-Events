[build]
  publish = "."
  functions = "netlify/functions"
  command = "python3 build.py"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/admin.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

# The site calls /api/spin and /api/assistant (Cloudflare addresses). This keeps them working if the
# site is ever served from Netlify again.
[[redirects]]
  from = "/api/spin"
  to = "/.netlify/functions/spin"
  status = 200

[[redirects]]
  from = "/api/assistant"
  to = "/.netlify/functions/assistant"
  status = 200
